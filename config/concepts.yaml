# Concept registry for controlled query expansion (see doc/architecture.md).
# `terms` are retrieval vocabulary; optional `triggers` narrow which query phrases activate a
# concept. When omitted, `terms` also act as triggers. Other terms (and related concepts one hop)
# are added as an extra lexical ranking. Expansion is bounded and configured here only.

concepts:
  - id: debug-access
    label: Debug access
    terms:
      - JTAG
      - SWD
      - debug port
      - debug interface
      - debug access
      - debug authentication
      - DAP
      - debug probe

  - id: firmware-extraction
    label: Firmware extraction protection
    terms:
      - firmware extraction
      - readout protection
      - RDP
      - code readout
      - flash readout
      - memory dump
    related: [debug-access, lifecycle-security]

  - id: lifecycle-security
    label: Device lifecycle security
    terms: [lifecycle, secure boot, root of trust, TrustZone, secure firmware, tamper]

  - id: physical-tampering
    label: Physical access and tampering
    terms:
      - physical access
      - physical attack surface
      - opening the enclosure
      - unauthorized physical access
      - component extraction
      - extraction of components
      - forced opening
      - tamper detection
      - active detection and reaction
      - PCB hardening

  - id: memory-protection
    label: Memory protection
    terms: [MPU, memory protection unit, write protection, access control, privileged access]

  - id: clock-configuration
    label: Clock configuration
    terms:
      - clock configuration
      - system clock
      - clock tree
      - PLL
      - prescaler
      - clock source
      - oscillator
      - HSE
      - HSI
    triggers:
      - system clock
      - clock tree
      - PLL
      - prescaler
      - clock source
      - oscillator
      - HSE
      - HSI

  - id: low-power
    label: Low-power operation
    terms:
      - battery life
      - low power
      - sleep mode
      - stop mode
      - standby
      - shutdown mode
      - wakeup
      - power consumption
    triggers:
      - battery life
      - battery runtime
      - extend battery life
      - reduce energy use

  - id: serial-uart
    label: Asynchronous serial communication
    terms: [UART, USART, baud rate, serial port, asynchronous serial]

  - id: dma-transfer
    label: Direct memory access
    terms: [DMA, direct memory access, DMA stream, DMA channel, scatter-gather]
    triggers:
      - direct memory access
      - scatter-gather
      - transfer data without CPU intervention
      - offload data transfers from the CPU

  - id: formal-verification
    label: Formal verification of C code
    terms:
      - ACSL
      - Frama-C
      - function contract
      - precondition
      - postcondition
      - formal verification
      - deductive verification
      - formally specify
      - formal specification

  - id: firmware-update
    label: Firmware update
    terms:
      - firmware update
      - update the firmware
      - bootloader
      - in-application programming
      - IAP
      - DFU
      - flash programming
    triggers:
      - update the firmware
      - update a deployed device
      - update a device in the field
    related: [lifecycle-security]
