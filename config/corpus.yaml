# Corpus manifest for `silicore-knowledge sync` (operator command; the HTTP API never downloads).
# Hashes of files without an explicit `sha256` are recorded in corpus.lock.json on first
# download (trust on first use) and verified afterwards. Commit the lock file.
#
# Only PDF and CMSIS-SVD files can be ingested today: list direct PDF URLs, not HTML pages.
# Document types should come from config/taxonomy.yaml; unknown types are reported by `sync`.
# `keywords` are optional retrieval terms indexed with the document's passages.

# Only these hosts may be contacted, redirects included. HTTPS only.
allowed_domains:
  - api.github.com
  - blog.h2lab.org
  - class.ece.iastate.edu
  - documentation-service.arm.com
  - docs.amd.com
  - nvlpubs.nist.gov
  - pep257.readthedocs.io
  - raw.githubusercontent.com
  - web.cs.dal.ca
  - www.nxp.com
  - www.st.com
  - www.ti.com
  - www.arm.com
  - frama-c.com
request_delay_s: 1.0
timeout_s: 60

sources:
  # Hardware description (SVD) files, pinned to a commit for reproducibility.
  - name: cmsis-svd
    kind: github_svd
    source_type: vendor
    repo: cmsis-svd/cmsis-svd-data
    ref: c65f8551e57c770344d229dcaa0bf838fa29aff4
    path_prefix: data
    vendors: [STMicro]
    # Pilot scope; remove `include` (and add Nordic, NXP, ...) to widen the corpus.
    include: [STM32F4*, STM32U5*, STM32N6*]
    family_pattern: "(STM32[A-Z][0-9])"
    manufacturers:
      STMicro: STMicroelectronics

  # ST documents (datasheets, reference manuals, application notes, errata, ...): list each
  # one explicitly. Take the URL from the document page on www.st.com; add `sha256` to pin it.
  - name: st-documents
    kind: urls
    source_type: official
    manufacturer: STMicroelectronics
    documents:
      - url: https://www.st.com/resource/en/datasheet/stm32u595ai.pdf
        title: STM32U595xx datasheet
        device_family: STM32U5
        document_type: datasheet
        keywords: [microcontroller, cortex-m33, low power, trustzone]
      - url: https://www.st.com/resource/en/datasheet/stm32u5a5zj.pdf
        title: STM32U5A5xx/U5A9xx datasheet
        device_family: STM32U5
        device: STM32U5A5
        document_type: datasheet
        keywords: [microcontroller, cortex-m33, graphics, low power]
      - url: https://www.st.com/resource/en/application_note/an5373-getting-started-with-stm32u5-mcu-hardware-development-stmicroelectronics.pdf
        title: AN5373 Getting started with STM32U5 MCU hardware development
        device_family: STM32U5
        document_type: application-note
        keywords: [getting started, hardware development, power supply, clock, layout]
      - url: https://www.st.com/resource/en/datasheet/stm32n657x0.pdf
        title: STM32N657x0 datasheet
        device_family: STM32N6
        device: STM32N657
        document_type: datasheet
        keywords: [microcontroller, cortex-m55, neural processing]
      - url: https://www.st.com/resource/en/datasheet/stm32f407vg.pdf
        title: STM32F405xx/407xx datasheet
        device_family: STM32F4
        device: STM32F407
        document_type: datasheet
        keywords: [microcontroller, cortex-m4]
      - url: https://www.st.com/resource/en/datasheet/stm32f429zi.pdf
        title: STM32F427xx/429xx datasheet
        device_family: STM32F4
        device: STM32F429
        document_type: datasheet
        keywords: [microcontroller, cortex-m4, lcd-tft]
      - url: https://www.st.com/resource/en/application_note/an4488-getting-started-with-stm32f4xxxx-mcu-hardware-development-stmicroelectronics.pdf
        title: AN4488 Getting started with STM32F4xxxx MCU hardware development
        device_family: STM32F4
        document_type: application-note
        keywords: [getting started, hardware development, power supply, clock, layout]
      - url: https://www.st.com/resource/en/errata_sheet/es0182-stm32f405407xx-and-stm32f415417xx-device-errata-stmicroelectronics.pdf
        title: ES0182 STM32F405/407xx and STM32F415/417xx device errata
        device_family: STM32F4
        device: STM32F407
        document_type: errata
        keywords: [errata, silicon limitation, workaround]

  # Formal specification languages and verification tooling.
  - name: frama-c
    kind: urls
    source_type: official
    documents:
      - url: https://frama-c.com/download/frama-c-acsl-implementation.pdf
        title: ACSL implementation (Frama-C)
        document_type: specification
        keywords: [acsl, frama-c, formal methods, verification, function contract, c]

  # H2Lab security, architecture and embedded-development guides.
  - name: h2lab-guides
    kind: urls
    source_type: official
    documents:
      - url: https://blog.h2lab.org/doc/h2lab-stig-jtag-001-en.pdf
        title: H2Lab STIG JTAG-001
        document_type: security-guide
        keywords: [jtag, swd, debug interface, secure debug]
      - url: https://blog.h2lab.org/doc/h2lab-stig-phy-001-en.pdf
        title: H2Lab STIG PHY-001
        document_type: technical-guide
        keywords: [phy, physical layer, hardware interface]
      - url: https://blog.h2lab.org/doc/h2lab-stig-emdev-001-en.pdf
        title: H2Lab STIG EMDEV-001
        document_type: technical-guide
        keywords: [embedded development, secure development, software]
      - url: https://blog.h2lab.org/doc/h2lab-stig-maj-001-en.pdf
        title: H2Lab STIG MAJ-001
        document_type: security-guide
        keywords: [software update, firmware update, security, maintenance]

  - name: nist-ssdf
    kind: urls
    source_type: official
    documents:
      - url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-218.pdf
        title: NIST SP 800-218 Secure Software Development Framework
        revision: "1.1"
        document_type: best-practice
        keywords: [ssdf, secure software development, software development lifecycle, software security, vulnerability management]

  # Language references. PEP 257 is classified as an RFC-like proposal, as requested.
  - name: language-references
    kind: urls
    source_type: community
    documents:
      - url: https://web.cs.dal.ca/~vlado/pl/C_Standard_2011-n1570.pdf
        title: C11 Committee Draft N1570
        revision: N1570
        document_type: standard
        keywords: [c, c11, language standard, syntax, semantics, atomics]
      - url: https://pep257.readthedocs.io/_/downloads/en/0.7.0/pdf/
        title: PEP 257 Docstring Conventions
        revision: PEP 257
        document_type: rfc
        keywords: [python, pep 257, docstrings, conventions, documentation]

  - name: arm-thumb2-reference
    kind: urls
    source_type: community
    documents:
      - url: https://class.ece.iastate.edu/cpre288/resources/docs/Thumb-2SupplementReferenceManual.pdf
        title: Thumb-2 Supplement Reference Manual
        document_type: programming-manual
        keywords: [arm, thumb-2, cortex-m, instruction set, assembler, assembly]

  - name: arm-boot-security
    kind: urls
    source_type: official
    manufacturer: Arm
    documents:
      - url: https://documentation-service.arm.com/static/68775ff446dc1e49e34ba2b0?token=
        title: Arm DEN0107 Base Boot Security Requirements v1.4
        revision: "1.4"
        document_type: requirement-document
        keywords: [base boot requirements, secure boot, platform security, SystemReady, UEFI]

  - name: i2c-specification
    kind: urls
    source_type: official
    manufacturer: NXP Semiconductors
    documents:
      - url: https://www.nxp.com/docs/en/user-guide/UM10204.pdf
        title: UM10204 I2C-bus specification and user manual
        document_type: protocol-specification
        keywords: [i2c, i2c-bus, two-wire serial, fast-mode, timing, protocol]

  - name: ti-components
    kind: urls
    source_type: official
    manufacturer: Texas Instruments
    documents:
      - url: https://www.ti.com/lit/ds/symlink/tmp102.pdf
        title: TMP102 Low-Power Digital Temperature Sensor with I2C Interface
        device: TMP102
        document_type: datasheet
        keywords: [temperature sensor, i2c, register map, conversion, alert]
      - url: https://www.ti.com/lit/ds/symlink/ads7042.pdf
        title: ADS7042 12-Bit Low-Power SAR ADC
        device: ADS7042
        document_type: datasheet
        keywords: [adc, analog-to-digital converter, spi, serial interface, sampling]

  - name: amd-fpga
    kind: urls
    source_type: official
    manufacturer: AMD
    documents:
      - url: https://docs.amd.com/api/khub/documents/iAkxxTOk96ANLJqYf2hgrQ/content
        title: Artix-7 FPGAs Data Sheet
        device_family: Artix-7
        document_type: datasheet
        keywords: [fpga, artix-7, logic resources, I/O, switching characteristics]

  # V1 ingests PDF and SVD only. HTML/Markdown sources (including Rust RFC pages) remain out
  # of scope until web/document extraction is implemented.
