# Corpus manifest for `silicore-knowledge sync` (operator command; the HTTP API never downloads).
# Hashes of files without an explicit `sha256` are recorded in corpus.lock.json on first
# download (trust on first use) and verified afterwards. Commit the lock file.

# Only these hosts may be contacted, redirects included. HTTPS only.
allowed_domains:
  - api.github.com
  - raw.githubusercontent.com
  - www.st.com
  - www.arm.com
  - frama-c.com
  - api.github.com
  - raw.githubusercontent.com
  - www.st.com
  - www.arm.com
request_delay_s: 1.0
timeout_s: 60

sources:
  # Hardware description (SVD) files, pinned to a commit for reproducibility.
  - name: cmsis-svd
    kind: github_svd
    source_type: vendor
    repo: cmsis-svd/cmsis-svd-data
    ref: c65f8551e57c770344d229dcaa0bf838fa29aff4
    path_prefix: data
    vendors: [STMicro]
    # Pilot scope; remove `include` (and add Nordic, NXP, ...) to widen the corpus.
    include: [STM32F4*, STM32U5*, STM32N6*]
    family_pattern: "(STM32[A-Z][0-9])"
    manufacturers:
      STMicro: STMicroelectronics

  # ST documents (datasheets, reference manuals, application notes, errata, ...): list each
  # one explicitly. Take the URL from the document page on www.st.com; add `sha256` to pin it.
  - name: st-documents
    kind: urls
    source_type: official
    manufacturer: STMicroelectronics
    documents:
      - url: https://www.st.com/resource/en/datasheet/stm32u595ai.pdf
        title: STM32U595xx datasheet
        device_family: STM32U5
        document_type: datasheet
        keywords: ["datasheet", "stm32u5", "microcontroller", "st", "embedded"]
      - url: https://www.st.com/resource/en/datasheet/stm32u5a5zj.pdf
        title: STM32U5A5xx/U5A9xx datasheet
        device_family: STM32U5
        device: STM32U5A5
        document_type: datasheet
        keywords: ["datasheet", "stm32u5", "microcontroller", "st", "embedded"]
      - url: https://www.st.com/resource/en/application_note/an5373-getting-started-with-stm32u5-mcu-hardware-development-stmicroelectronics.pdf
        title: AN5373 Getting started with STM32U5 MCU hardware development
        device_family: STM32U5
        document_type: technical-guide
        keywords: ["getting started", "stm32u5", "hardware development", "mcu", "embedded"]
      - url: https://www.st.com/resource/en/datasheet/stm32n657x0.pdf
        title: STM32N657x0 datasheet
        device_family: STM32N6
        device: STM32N657
        document_type: datasheet
        keywords: ["datasheet", "stm32n6", "microcontroller", "st", "embedded"]
      - url: https://www.st.com/resource/en/datasheet/stm32f407vg.pdf
        title: STM32F405xx/407xx datasheet
        device_family: STM32F4
        device: STM32F407
        document_type: datasheet
        keywords: ["datasheet", "stm32f4", "microcontroller", "st", "embedded"]
      - url: https://www.st.com/resource/en/datasheet/stm32f429zi.pdf
        title: STM32F427xx/429xx datasheet
        device_family: STM32F4
        device: STM32F429
        document_type: datasheet
        keywords: ["datasheet", "stm32f4", "microcontroller", "st", "embedded"]
      - url: https://www.st.com/resource/en/application_note/an4488-getting-started-with-stm32f4xxxx-mcu-hardware-development-stmicroelectronics.pdf
        title: AN4488 Getting started with STM32F4xxxx MCU hardware development
        device_family: STM32F4
        document_type: technical-guide
        keywords: ["getting started", "stm32f4", "hardware development", "mcu", "embedded"]
      - url: https://www.st.com/resource/en/errata_sheet/es0182-stm32f405407xx-and-stm32f415417xx-device-errata-stmicroelectronics.pdf
        title: ES0182 STM32F405/407xx and STM32F415/417xx device errata
        device_family: STM32F4
        device: STM32F407
        document_type: errata
        keywords: ["errata", "stm32f4", "device", "st", "embedded"]
      - url: https://frama-c.com/download/frama-c-acsl-implementation.pdf
        title: Frama-C ACSL Implementation
        device_family: Frama-C
        document_type: specification
        keywords: ["acsl", "frama-c", "formal-methods", "verification", "language-specification"]

  # Additional technical guides and documentation
  - name: technical-guides
    kind: urls
    source_type: community
    manufacturer: "Various"
    documents:
      - url: https://arm.com/resources/developer-tools/cortex-m/technical-guides
        title: ARM Cortex-M Technical Guides
        device_family: "ARM"
        document_type: technical-guide
        keywords: ["technical guide", "arm", "cortex-m", "embedded", "microcontroller"]
      - url: https://docs.zephyrproject.org/latest/index.html
        title: Zephyr OS Documentation
        device_family: "Generic"
        document_type: technical-guide
        keywords: ["technical guide", "zephyr", "operating system", "embedded", "rtos"]

  # Requirement documents and specifications
  - name: requirement-docs
    kind: urls
    source_type: official
    manufacturer: "Various"
    documents:
      - url: https://www.iso.org/isoiec-12207-2008
        title: ISO/IEC 12207 Software Life Cycle Processes
        device_family: "Software"
        document_type: requirement-document
        keywords: ["requirement", "software", "lifecycle", "process", "specification"]
      - url: https://www.nist.gov/sites/default/files/documents/itl/1800/1800-1.pdf
        title: NIST Cybersecurity Framework
        device_family: "Security"
        document_type: requirement-document
        keywords: ["requirement", "security", "framework", "nist", "compliance"]

  # Hardware specification documents
  - name: hardware-specs
    kind: urls
    source_type: official
    manufacturer: "Various"
    documents:
      - url: https://www.usb.org/specifications
        title: USB Specifications
        device_family: "USB"
        document_type: specification
        keywords: ["specification", "usb", "protocol", "interface", "standards"]
      - url: https://www.ieee.org/standards/index.html
        title: IEEE Standards
        device_family: "Standards"
        document_type: specification
        keywords: ["specification", "ieee", "standards", "protocol", "interface"]

  # Best practice guides for different programming languages and development methodologies
  - name: best-practice-guides
    kind: urls
    source_type: community
    manufacturer: "Various"
    documents:
      - url: https://google.github.io/styleguide/cppguide.html
        title: Google C++ Style Guide
        device_family: "C++"
        document_type: best-practice
        keywords: ["best practice", "cpp", "c++", "style guide", "coding"]
      - url: https://doc.rust-lang.org/book/
        title: Rust Programming Language Book
        device_family: "Rust"
        document_type: best-practice
        keywords: ["best practice", "rust", "programming", "book", "development"]
      - url: https://docs.python.org/3/tutorial/index.html
        title: Python Tutorial
        device_family: "Python"
        document_type: best-practice
        keywords: ["best practice", "python", "tutorial", "development", "programming"]

