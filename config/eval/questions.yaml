# Pilot evaluation questions for `silicore-knowledge evaluate`.
# Each question lists the evidence a correct answer needs; `document` is matched against the
# document id, title and device, `contains` against the chunk text (case-insensitive).
# Each `expect` entry is an acceptable alternative; all its criteria must match.
# Categories describe the domain under evaluation (register, address, bitfield, dma, timing,
# hardware, errata, cross, intent, security, architecture, development, language, assembly,
# protocol, peripheral and fpga).
# Gap: only one errata sheet (ES0182, STM32F407) in the pilot corpus.

questions:
  # --- registers and addresses (SVD) ---
  - id: f407-usart1-cr1
    category: register
    query: USART1 control register 1 address STM32F407
    filters: {device: STM32F407}
    expect: [{peripheral: USART1, contains: ["USART1_CR1", "0x4001100C"]}]
  - id: f407-gpioa-moder
    category: address
    query: GPIOA MODER port mode register address
    filters: {device: STM32F407}
    expect: [{peripheral: GPIOA, contains: ["GPIOA_MODER", "0x40020000"]}]
  - id: f407-rcc-ahb1enr
    category: register
    query: RCC AHB1 peripheral clock enable register
    filters: {device: STM32F407}
    expect: [{peripheral: RCC, contains: ["RCC_AHB1ENR"]}]
  - id: f407-flash-latency
    category: bitfield
    query: FLASH_ACR LATENCY wait states bits
    filters: {device: STM32F407}
    expect: [{peripheral: FLASH, contains: ["FLASH_ACR", "LATENCY"]}]
  - id: f429-sdram
    category: register
    query: FMC SDRAM control register SDCR
    filters: {device: STM32F429}
    expect: [{contains: ["SDCR"], section: FMC}]
  - id: u595-icache-cr
    category: bitfield
    query: ICACHE control register enable bit
    filters: {device: STM32U595}
    expect: [{peripheral: ICACHE, contains: ["ICACHE_CR", "EN"]}]
  - id: u595-usart1-cr1
    category: register
    query: USART1 CR1 FIFO enable FIFOEN
    filters: {device: STM32U595}
    expect: [{peripheral: USART1, contains: ["USART1_CR1", "FIFOEN"]}]
  - id: u5a5-rcc-ccipr
    category: register
    query: RCC peripherals independent clock configuration register
    filters: {device: STM32U5A5}
    expect: [{peripheral: RCC, contains: ["CCIPR"]}]
  - id: u5a9-ltdc
    category: register
    query: LTDC layer 1 window horizontal position configuration register
    filters: {device: STM32U5A9}
    expect: [{peripheral: LTDC, contains: ["L1WHPCR"]}]
  - id: f446-i2c-cr1
    category: bitfield
    query: I2C1 CR1 software reset SWRST bit
    filters: {device: STM32F446}
    expect: [{peripheral: I2C1, contains: ["SWRST"]}]

  # --- DMA ---
  - id: f407-dma2-s0cr
    category: dma
    query: DMA2 stream 0 configuration register channel selection CHSEL
    filters: {device: STM32F407}
    expect: [{peripheral: DMA2, contains: ["DMA2_S0CR", "CHSEL"]}]
  - id: f407-dma-fifo
    category: dma
    query: DMA stream x FIFO control register FEIE direct mode error
    filters: {device: STM32F407}
    expect: [{peripheral: DMA1, contains: ["S0FCR"]}, {peripheral: DMA2, contains: ["S0FCR"]}]
  - id: u595-gpdma-ccr
    category: dma
    query: GPDMA1 channel control register
    filters: {device: STM32U595}
    expect: [{peripheral: GPDMA1}]
  - id: u595-gpdma-tcem
    category: dma
    query: GPDMA1_GPDMA_C0TR2 TCEM
    filters: {device: STM32U595, peripheral: GPDMA1}
    expect: [{contains: ["GPDMA1_GPDMA_C0TR2", "TCEM", "Transfer complete event mode"]}]
  - id: f4-datasheet-dma
    category: dma
    query: number of DMA streams and FIFOs
    expect: [{document: 407xx-datasheet, contains: ["stream"]}]

  # --- timing and electrical characteristics (datasheets) ---
  - id: f407-max-freq
    category: timing
    query: maximum CPU frequency 168 MHz
    expect: [{document: 407xx-datasheet, contains: ["168 MHz"]}]
  - id: u595-max-freq
    category: timing
    query: maximum frequency of the Cortex-M33 160 MHz
    expect: [{document: u595xx-datasheet, contains: ["160 MHz"]}]
  - id: n657-core
    category: timing
    query: STM32N657 Arm Cortex-M55 core maximum frequency
    expect: [{document: n657x0-datasheet, contains: ["Cortex-M55"]}]
  - id: f4-supply-range
    category: timing
    query: application supply voltage VDD range 1.8 V to 3.6 V
    expect: [{document: 407xx-datasheet, contains: ["1.8"]}]
  - id: u5-supply-range
    category: timing
    query: VDD operating voltage range 1.71 V to 3.6 V
    expect: [{document: u595xx-datasheet, contains: ["1.71"]}]
  - id: u5a5-gpu
    category: hardware
    query: Neo-Chrom graphic accelerator GPU2D features
    expect: [{document: u5a5xx, contains: ["Chrom"]}]

  # --- hardware design (application notes) ---
  - id: an4488-vcap
    category: hardware
    query: VCAP pins external capacitor regulator STM32F4
    expect: [{document: an4488, contains: ["VCAP"]}]
  - id: an4488-boot0
    category: hardware
    query: BOOT0 pin boot mode selection
    expect: [{document: an4488, contains: ["BOOT0"]}]
  - id: an5373-smps
    category: hardware
    query: STM32U5 SMPS step-down converter external components
    expect: [{document: an5373, contains: ["SMPS"]}]
  - id: an5373-hse
    category: hardware
    query: HSE crystal oscillator load capacitors layout
    filters: {device_family: STM32U5}
    expect: [{document: an5373, contains: ["HSE"]}]

  - id: f407-errata-i2c-stop
    category: errata
    query: I2C start cannot be generated after a misplaced Stop
    filters: {device_family: STM32F4}
    expect: [{document: es0182, contains: ["misplaced Stop"]}]
  - id: f407-errata-smbus
    category: errata
    query: SMBus not fully supported errata
    filters: {device: STM32F407}
    expect: [{document: es0182, contains: ["SMBus"]}]

  # --- cross-corpus ---
  - id: cross-u5-rcc
    category: cross
    query: how to enable the USART1 peripheral clock on STM32U5
    expect: [{document: u5, contains: ["APB2ENR", "USART1EN"]}]

  # --- technical intent (exercises the concept registry and query expansion) ---
  # These queries avoid the vocabulary of the documents on purpose: without expansion they
  # rely on chance; with config/concepts.yaml they should reach the right passages.
  - id: intent-firmware-extraction
    category: intent
    query: prevent firmware extraction from the microcontroller
    expect: [{contains: ["RDP"]}, {contains: ["readout protection"]}, {contains: ["TrustZone"]}]
  - id: intent-debug-lock
    category: intent
    query: lock the debug interface before shipping the product
    expect: [{contains: ["JTAG"]}, {contains: ["SWD"]}, {contains: ["debug authentication"]}]
  - id: intent-formal-contracts
    category: intent
    query: formally specify the behavior of C functions
    expect: [{document: acsl}]
  - id: intent-field-update
    category: intent
    query: update the firmware of a deployed device in the field
    expect:
      - {document: Arm DEN0107, contains: ["secure firmware update"]}
      - {contains: ["bootloader"]}
      - {contains: ["DFU"]}
      - {contains: ["flash programming"]}
  - id: intent-battery-life
    category: intent
    query: extend the battery life of the application
    expect: [{contains: ["stop mode"]}, {contains: ["standby"]}, {contains: ["low-power"]}]

  # --- V1 corpus enrichment: security and architecture guides ---
  - id: h2lab-jtag-security
    category: security
    query: JTAG debug access protect debug interface
    expect:
      - document: H2Lab STIG JTAG-001
        contains: [debug authentication]
  - id: h2lab-phy-architecture
    category: architecture
    query: PHY attack surface hardware security
    expect:
      - document: H2Lab STIG PHY-001
        contains: [T02 extraction]
  - id: h2lab-embedded-development
    category: development
    query: secure development process tests coverage embedded firmware
    expect:
      - document: H2Lab STIG EMDEV-001
        contains: [input bounds]
  - id: nist-ssdf-code-review
    category: development
    query: NIST SSDF review source code to identify vulnerabilities before release
    expect:
      - document: NIST SP 800-218
        contains: [PW.7.1, code review]
  - id: h2lab-secure-update
    category: security
    query: secure maintenance firmware update
    expect:
      - document: H2Lab STIG MAJ-001
        contains: [A/B update state machine]
  - id: arm-den0107-secure-boot
    category: security
    query: requirements for secure boot chain of trust
    expect:
      - document: Arm DEN0107
        contains: [image integrity]
  - id: intent-modified-firmware
    category: intent
    query: prevent modified firmware from executing after reset
    expect:
      - document: Arm DEN0107
        contains: [image integrity]
  - id: intent-physical-intrusion
    category: intent
    query: Detect an intruder opening the enclosure before components are removed
    expect:
      - document: H2Lab STIG PHY-001
        contains: [exfiltration window]

  # --- V1 corpus enrichment: language and assembly references ---
  - id: c11-atomics
    category: language
    query: N1570 C11 stdatomic.h atomic_compare_exchange_explicit memory_order
    expect:
      - document: C11 Committee Draft N1570
        contains: [atomic_compare_exchange]
  - id: python-pep257
    category: language
    query: PEP 257 one-line docstring summary
    expect:
      - document: PEP 257
        contains: [D200, "One-line docstring"]
  - id: arm-thumb2-instructions
    category: assembly
    query: Thumb-2 instruction set assembly reference manual
    expect:
      - document: Thumb-2 Supplement Reference Manual
        contains: [Thumb-2]

  # --- V1 corpus enrichment: protocols and component datasheets ---
  - id: i2c-clock-stretching
    category: protocol
    query: I2C bus fast mode timing clock stretching specification
    expect:
      - document: UM10204
        contains: [clock stretching]
  - id: tmp102-i2c-register
    category: peripheral
    query: TMP102 temperature register I2C conversion rate
    expect:
      - document: TMP102
        contains: [conversion rates]
  - id: ads7042-spi
    category: peripheral
    query: ADS7042 SPI serial peripheral interface sample rate
    expect:
      - document: ADS7042
        contains: [12-bit]
  - id: artix7-fpga-datasheet
    category: fpga
    query: Artix 7 FPGA eFUSE programming conditions
    expect:
      - document: Artix-7 FPGAs Data Sheet
        contains: [eFUSE]
