# Example configuration. Every key can be overridden with an environment variable
# PYGDBKNOWLEDGE__<SECTION>__<KEY>, e.g. PYGDBKNOWLEDGE__SERVER__PORT=9000.
# Keep tokens out of this file: set PYGDBKNOWLEDGE__AUTH__READ_TOKEN and
# PYGDBKNOWLEDGE__AUTH__ADMIN_TOKEN in the environment (distinct values).

workspace: /var/lib/pygdbknowledge
log_level: INFO

server:
  host: 127.0.0.1
  port: 8080

qdrant:
  url: http://127.0.0.1:6333
  collection: knowledge

embeddings:
  enabled: false            # true: semantic search with the model below and Qdrant
  model: BAAI/bge-m3        # local path or locally cached model name
  allow_download: false     # keep false: the daemon makes no outbound connection
  batch_size: 16
  max_seq_length: 512

ingestion:
  max_pages: 5000
  max_chars: 40000000
  chunk_max_chars: 1500     # roughly 400 tokens, well below the embedding sequence limit
  chunk_overlap_chars: 150
  quarantine_suspicious: true   # prompt-injection-like content: quarantine instead of index
  import_dirs: []           # server-side directories the admin API may import PDFs from

ocr:
  enabled: false            # needs the 'ocr' extra and the tesseract binary
  language: eng             # tesseract language(s), e.g. eng+fra
  timeout_s: 1800
  min_chars_per_page: 40    # OCR only when the average text per page is below this
limits:
  max_results: 20
  default_results: 8
  max_text_chars: 4000
  max_query_chars: 500
  min_score: 0.0
  request_timeout_s: 20
  rate_limit_per_minute: 120
  max_upload_bytes: 209715200
