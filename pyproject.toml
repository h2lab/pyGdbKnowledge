[build-system]
requires = ["setuptools>=80", "setuptools_scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "pyGdbKnowledge"
description = "Local knowledge server (hybrid RAG) for pyGdbToolkit"
dynamic = ["version"]
requires-python = ">= 3.12"
readme = "README.md"
authors = [
  {name = "Florent Valette"},
  {name = "Philippe Thierry"},
]
license = {file = "LICENSES/Apache-2.0.txt"}
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "PyYAML>=6",
    "uvicorn>=0.32",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/h2lab"
Repository = "https://github.com/h2lab/pyGdbKnowledge"
Issues = "https://github.com/h2lab/pyGdbKnowledge/issues"

[project.scripts]
pyGdbKnowledge = "pyGdbKnowledge.cli:main"

[project.optional-dependencies]
vector = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3",
]
pdf = [
    "PyMuPDF>=1.24",
]
ocr = [
    "ocrmypdf>=16",
]
dev = [
    "black",
    "flake8",
    "flake8-docstrings",
    "httpx2",
    "mypy",
    "pytest",
    "pytest-cov",
    "qdrant-client>=1.12",
    "types-PyYAML",
]

[tool.setuptools_scm]

[tool.black]
line-length = 100
diff = true
check = true
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
source = ["pyGdbKnowledge"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
