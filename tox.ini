[tox]
envlist = py312, py313, lint, typecheck
isolated_build = True

[testenv]
deps =
    httpx2
    pytest
    pytest-cov
    pypdf
    reportlab
    qdrant-client
commands =
    pytest --cov=silicore_knowledge --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml {posargs}

[testenv:lint]
deps =
    black
    flake8
    flake8-docstrings
commands =
    black --check src tests
    flake8 src tests

[testenv:typecheck]
extras = dev
deps =
    mypy
commands =
    mypy src
